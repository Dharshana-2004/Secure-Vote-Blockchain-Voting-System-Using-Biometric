<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    {%load static%}
    <link rel="stylesheet" href="{% static 'css/signin.css'%}">
    <title>Login</title>
  </head>
  <body>
        <a href="admin/"><button class="admin">ADMIN PANEL</button></a>
    <div class="lefttext">
        {% comment %} <p>A space to capture your memories!</p> {% endcomment %}
        <image >
    </div>
    <div class="center">
      <h1>Let's get started</h1>
      <form action="{% url 'signin' %}" method="post" id="signinForm" novalidate>
        {% csrf_token %}
        <div class="txt_field">
          <input type="text" name="username" id="username" required autocomplete="username">
          <span></span>
          <label>Username</label>
        </div>
        <div class="txt_field">
          <input type="password" name="pass1" id="pass1" required autocomplete="current-password">
          <span></span>
          <label>Password</label>
        </div>
        <input type="hidden" id="signin_face_snapshot" name="face_snapshot">
        <div class="face-card" id="signinFaceCard">
          <div class="face-card__header">
            <h4>Facial Verification</h4>
            <p class="face-card__status" id="signinFaceStatus">Position your face within the frame.</p>
          </div>
          <div class="face-card__body">
            <video id="signinFaceVideo" autoplay playsinline muted></video>
            <canvas id="signinFaceCanvas" hidden></canvas>
            <img id="signinFacePreview" alt="Face preview" hidden>
          </div>
          <div class="face-card__actions">
            <button type="button" class="face-btn" id="signinFaceStart">Start Camera</button>
            <button type="button" class="face-btn face-btn--capture" id="signinFaceCapture" disabled>Capture Face</button>
            <button type="button" class="face-btn face-btn--ghost" id="signinFaceRetake" hidden>Retake</button>
          </div>
        </div>
        <center style="color:#21304a;">{% for message in messages %}
        <b><i>{{message}}</i></b>
        {% endfor %}</center>
        <br/>
        <input type="submit" value="Verify face &amp; Login" id="signinSubmit" disabled>
      </form>
    </div>
    <script src="{% static 'js/face.js' %}"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        window.initFaceSignin({
          cardSelector: '#signinFaceCard',
          statusSelector: '#signinFaceStatus',
          startButtonSelector: '#signinFaceStart',
          captureButtonSelector: '#signinFaceCapture',
          retakeButtonSelector: '#signinFaceRetake',
          videoSelector: '#signinFaceVideo',
          canvasSelector: '#signinFaceCanvas',
          previewSelector: '#signinFacePreview',
          snapshotFieldSelector: '#signin_face_snapshot',
          submitButtonSelector: '#signinSubmit',
          formSelector: '#signinForm',
        });
      });
    </script>
  </body>
</html>
